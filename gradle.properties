# 4 GB porque con 2 el compilador de Kotlin y el de Compose se quedan justos y acaban recogiendo
# basura sin parar en vez de compilar.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# Reutiliza el resultado de las tareas que ya se hicieron con las mismas entradas, aunque sea de
# otra rama: volver a una rama anterior deja de costar una compilación entera.
org.gradle.caching=true

# Los módulos independientes se compilan a la vez. Aquí solo hay uno, pero también aprovecha
# dentro de las tareas de Android.
org.gradle.parallel=true

# Se salta la fase de configuración cuando nada del build ha cambiado, que es lo normal mientras
# se trabaja en el código.
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
